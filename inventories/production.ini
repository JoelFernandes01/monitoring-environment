k8s-control-plane-02 ansible_host=10.0.39.52
k8s-control-plane-03 ansible_host=10.0.39.53

[k8s_workers]
k8s-worker-01 ansible_host=10.0.39.61
k8s-worker-02 ansible_host=10.0.39.62
k8s-worker-03 ansible_host=10.0.39.63

[loadbalancers]
