---
- name: 02 - Deploy Zabbix Server 8.0, Agent Sidecar e Web Interface via Traefik Ingress
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    zabbix_namespace: "zabbix"
    zabbix_version_tag: "ubuntu-8.0-latest"

  tasks:
    - name: Implantar Zabbix Server Deployment com Sidecar Agent 2
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: zabbix-server
            namespace: "{{ zabbix_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: zabbix-server
            template:
              metadata:
                labels:
                  app: zabbix-server
              spec:
                containers:
                  - name: zabbix-server
                    image: "zabbix/zabbix-server-pgsql:{{ zabbix_version_tag }}"
                    env:
                      - name: DB_SERVER_HOST
                        value: "zabbix-db-service"
                      - name: POSTGRES_DB
                        value: "zabbix"
                      - name: POSTGRES_USER
                        value: "zabbix"
                      - name: POSTGRES_PASSWORD
                        value: "ZabbixSecurePassword2026!"
                    ports:
                      - containerPort: 10051

                  - name: zabbix-agent
                    image: "zabbix/zabbix-agent2:{{ zabbix_version_tag }}"
                    env:
                      - name: ZBX_SERVER_HOST
                        value: "127.0.0.1"
                      - name: ZBX_HOSTNAME
                        value: "Zabbix server"
                    ports:
                      - containerPort: 10050

    - name: Criar Service ClusterIP para Zabbix Server
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: zabbix-server-service
            namespace: "{{ zabbix_namespace }}"
          spec:
            type: ClusterIP
            selector:
              app: zabbix-server
            ports:
              - name: trapper
                port: 10051
                targetPort: 10051

    - name: Implantar Zabbix Web Interface Deployment
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: zabbix-web
            namespace: "{{ zabbix_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: zabbix-web
            template:
              metadata:
                labels:
                  app: zabbix-web
              spec:
                containers:
                  - name: zabbix-web
                    image: "zabbix/zabbix-web-nginx-pgsql:{{ zabbix_version_tag }}"
                    env:
                      - name: DB_SERVER_HOST
                        value: "zabbix-db-service"
                      - name: POSTGRES_DB
                        value: "zabbix"
                      - name: POSTGRES_USER
                        value: "zabbix"
                      - name: POSTGRES_PASSWORD
                        value: "ZabbixSecurePassword2026!"
                      - name: ZBX_SERVER_HOST
                        value: "zabbix-server-service"
                      - name: ZBX_SERVER_PORT
                        value: "10051"
                      - name: PHP_TZ
                        value: "America/Sao_Paulo"
                    ports:
                      - containerPort: 8080

    - name: Criar Service ClusterIP para Zabbix Web
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: zabbix-web-service
            namespace: "{{ zabbix_namespace }}"
          spec:
            type: ClusterIP
            selector:
              app: zabbix-web
            ports:
              - name: http
                port: 8080
                targetPort: 8080

    - name: Criar Traefik Ingress para Zabbix Web
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: zabbix-web-ingress
            namespace: "{{ zabbix_namespace }}"
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web
          spec:
            ingressClassName: traefik
            rules:
              - host: zabbix.nverse.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: zabbix-web-service
                          port:
                            number: 8080
              - host: zabbix.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: zabbix-web-service
                          port:
                            number: 8080
