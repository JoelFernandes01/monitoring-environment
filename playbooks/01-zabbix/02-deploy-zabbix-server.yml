---
- name: 02 - Deploy Zabbix Server 8.0 e Web Interface Nginx/PgSQL
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    zabbix_namespace: "zabbix"
    zabbix_tag: "ubuntu-8.0-latest"

  tasks:
    - name: Implantar Zabbix Server 8.0 Deployment
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: zabbix-server
            namespace: "{{ zabbix_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: zabbix-server
            template:
              metadata:
                labels:
                  app: zabbix-server
              spec:
                containers:
                  - name: zabbix-server
                    image: "zabbix/zabbix-server-pgsql:{{ zabbix_tag }}"
                    env:
                      - name: DB_SERVER_HOST
                        value: "zabbix-db-service"
                      - name: POSTGRES_DB
                        value: "zabbix"
                      - name: POSTGRES_USER
                        value: "zabbix"
                      - name: POSTGRES_PASSWORD
                        value: "ZabbixSecurePassword2026!"
                    ports:
                      - containerPort: 10051

    - name: Criar Service ClusterIP para Zabbix Server (Porta 10051 Trappers/Agents)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: zabbix-server-service
            namespace: "{{ zabbix_namespace }}"
          spec:
            type: ClusterIP
            selector:
              app: zabbix-server
            ports:
              - name: trapper
                port: 10051
                targetPort: 10051

    - name: Implantar Zabbix Web Interface 8.0 Deployment
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: zabbix-web
            namespace: "{{ zabbix_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: zabbix-web
            template:
              metadata:
                labels:
                  app: zabbix-web
              spec:
                containers:
                  - name: zabbix-web
                    image: "zabbix/zabbix-web-nginx-pgsql:{{ zabbix_tag }}"
                    env:
                      - name: DB_SERVER_HOST
                        value: "zabbix-db-service"
                      - name: POSTGRES_DB
                        value: "zabbix"
                      - name: POSTGRES_USER
                        value: "zabbix"
                      - name: POSTGRES_PASSWORD
                        value: "ZabbixSecurePassword2026!"
                      - name: ZBX_SERVER_HOST
                        value: "zabbix-server"
                      - name: PHP_TZ
                        value: "America/Sao_Paulo"
                    ports:
                      - containerPort: 8080

    - name: Criar Service LoadBalancer para Zabbix Web (IP MetalLB: 10.0.39.201)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: zabbix-web-service
            namespace: "{{ zabbix_namespace }}"
          spec:
            type: LoadBalancer
            loadBalancerIP: 10.0.39.201
            selector:
              app: zabbix-web
            ports:
              - port: 80
                targetPort: 8080

    - name: Aguardar pod do Zabbix Server e Web em estado Ready
      ansible.builtin.command: >
        kubectl rollout status deployment/zabbix-server -n {{ zabbix_namespace }} --timeout=180s --kubeconfig={{ kubeconfig_path }}
      changed_when: false
