---
- name: 09 - Valida Conectividade e Prontidao da Stack de Observabilidade
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"

  tasks:
    - name: Validar resposta HTTP do Zabbix Web (10.0.39.201)
      ansible.builtin.uri:
        url: "10.0.39.201"
        status_code: 200
      register: zabbix_web_check
      retries: 5
      delay: 5

    - name: Validar resposta HTTP do Grafana (10.0.39.202)
      ansible.builtin.uri:
        url: "10.0.39.202/api/health"
        status_code: 200
      register: grafana_health_check
      retries: 5
      delay: 5

    - name: Exibir resumo da validacao E2E
      ansible.builtin.debug:
        msg:
          - "=== STACK DE MONITORAMENTO OPERACIONAL ==="
          - "Zabbix Web UI: HTTP 200 OK (10.0.39.201)"
          - "Grafana UI: HTTP 200 OK (10.0.39.202)"
          - "Prometheus DB: Ativo via ClusterIP no namespace monitoring"
