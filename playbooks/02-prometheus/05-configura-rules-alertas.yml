---
- name: 05 - Configura Regras de Alerta do Prometheus
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    monitoring_namespace: "monitoring"

  tasks:
    - name: Aplicar manifesto PrometheusRule
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: monitoring.coreos/v1
          kind: PrometheusRule
          metadata:
            name: custom-k8s-alerts
            namespace: "{{ monitoring_namespace }}"
            labels:
              release: kube-prometheus-stack
          spec:
            groups:
              - name: cluster-health
                rules:
                  - alert: HighNodeCPUUsage
                    expr: "node_cpu_seconds_total > 85"
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Uso elevado de CPU detectado no no"
                      description: "A CPU do no esta acima de 85% por mais de 5 minutos."
