---
- name: Expor Dashboard do Prometheus via Traefik Ingress
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    monitoring_namespace: "monitoring"

  tasks:
    - name: Criar Traefik Ingress para o Prometheus (prometheus.nverse.local e prometheus.local)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: prometheus-ingress
            namespace: "{{ monitoring_namespace }}"
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web
          spec:
            ingressClassName: traefik
            rules:
              - host: prometheus.nverse.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kube-prometheus-stack-prometheus
                          port:
                            number: 9090
              - host: prometheus.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kube-prometheus-stack-prometheus
                          port:
                            number: 9090

    - name: Criar Traefik Ingress para o Alertmanager (opcional - alertmanager.nverse.local)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: alertmanager-ingress
            namespace: "{{ monitoring_namespace }}"
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web
          spec:
            ingressClassName: traefik
            rules:
              - host: alertmanager.nverse.local
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: kube-prometheus-stack-alertmanager
                          port:
                            number: 9093

    - name: Exibir instrucoes de acesso
      ansible.builtin.debug:
        msg: "Ingress do Prometheus criado com sucesso! Acesse em http://prometheus.nverse.local (e Alertmanager em http://alertmanager.nverse.local)"
