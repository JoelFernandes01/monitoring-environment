---
- name: 00 - Prepara Namespace e Storage PVC para o Zabbix
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    zabbix_namespace: "zabbix"

  tasks:
    - name: Criar Namespace zabbix
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ zabbix_namespace }}"

    - name: Criar PersistentVolumeClaim (PVC) NFS para o PostgreSQL do Zabbix
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: zabbix-db-pvc
            namespace: "{{ zabbix_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: nfs-client
            resources:
              requests:
                storage: 10Gi
