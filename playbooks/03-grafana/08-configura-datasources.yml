---
- name: 07 - Provisiona DataSources do Prometheus e Zabbix 8.0 no Grafana via FQDN/ClusterIP
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    monitoring_namespace: "monitoring"

  tasks:
    - name: Criar ConfigMap de DataSources para o Grafana (Prometheus + Zabbix 8.0)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasources-custom
            namespace: "{{ monitoring_namespace }}"
            labels:
              grafana_datasource: "1"
          data:
            datasources.yaml: |
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: http://kube-prometheus-stack-prometheus:9090
                  isDefault: true
                - name: Zabbix
                  type: alexanderzobnin-zabbix-datasource
                  access: proxy
                  url: http://zabbix-web-service.zabbix.svc.cluster.local:8080/api_jsonrpc.php
                  jsonData:
                    username: Admin
                    zabbixVersion: 7

    - name: Reiniciar Pod do Grafana para aplicar os DataSources
      ansible.builtin.shell: |
        kubectl --kubeconfig {{ kubeconfig_path }} rollout restart deployment/kube-prometheus-stack-grafana -n {{ monitoring_namespace }}
