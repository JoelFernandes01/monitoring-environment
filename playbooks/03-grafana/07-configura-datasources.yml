---
- name: 07 - Provisiona DataSources do Prometheus e Zabbix no Grafana
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    monitoring_namespace: "monitoring"

  tasks:
    - name: Criar ConfigMap de DataSources para o Grafana
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig_path }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: grafana-datasources-custom
            namespace: "{{ monitoring_namespace }}"
            labels:
              grafana_datasource: "1"
          data:
            datasources.yaml: |
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  access: proxy
                  url: "kube-prometheus-stack-prometheus.monitoring.svc:9090"
                  isDefault: true
                - name: Zabbix
                  type: alexanderzobnin-zabbix-datasource
                  access: proxy
                  url: "10.0.39.201/api_jsonrpc.php"
                  jsonData:
                    username: "Admin"
                    trends: true
