---
- name: 06 - Configura Plugins e Ajustes no Grafana
  hosts: k8s-control-plane-01
  become: yes
  vars:
    kubeconfig_path: "/etc/kubernetes/admin.conf"
    monitoring_namespace: "monitoring"

  tasks:
    - name: Instalar Plugin Oficial do Zabbix no Pod do Grafana
      ansible.builtin.command: >
        kubectl exec -n {{ monitoring_namespace }}
        deployment/kube-prometheus-stack-grafana
        -- grafana-cli plugins install alexanderzobnin-zabbix-app
        --kubeconfig={{ kubeconfig_path }}
      register: plugin_install
      changed_when: "'Installed' in plugin_install.stdout"
      ignore_errors: true

    - name: Reiniciar Pod do Grafana para carregar o plugin Zabbix
      ansible.builtin.command: >
        kubectl rollout restart deployment/kube-prometheus-stack-grafana
        -n {{ monitoring_namespace }}
        --kubeconfig={{ kubeconfig_path }}
      changed_when: true
